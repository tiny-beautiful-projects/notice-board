<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>질문 게시판</title>
</head>
<body>
<h1>질문 목록</h1>
<table border="1">
    <thead>
    <tr>
        <th>번호</th>
        <th>제목</th>
        <th>등록일시</th>
    </tr>
    </thead>
    <tbody>
    <!-- questionList를 순회하며 tr 태그를 반복 생성 -->
    <tr th:each="question : ${questionList}">
        <td th:text="${question.id}">1</td>
        <td th:text="${question.subject}">제목 예시</td>
        <td th:text="${question.createDate}">2026-04-23</td>
    </tr>
    </tbody>
</table>
</body>
</html>
