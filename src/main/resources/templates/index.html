<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>질문 게시판</title>
    <!-- 외부 CSS 연결 -->
    <link rel="stylesheet" type="text/css" th:href="@{/index.css}">
</head>
<body>

<div class="board-container">
    <h1>질문 게시판</h1>

    <!-- 질문 등록 폼 -->
    <form action="/question/create" method="post" class="question-form">
        <div class="form-group">
            <label for="subject">제목</label>
            <input type="text" id="subject" name="subject" placeholder="제목을 입력하세요" required>
        </div>
        <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" name="content" rows="4" placeholder="내용을 입력하세요" required></textarea>
        </div>
        <button type="submit" class="btn-submit">질문 등록</button>
    </form>

    <!-- 질문 목록 테이블 -->
    <table>
        <thead>
        <tr>
            <th style="width: 10%;">번호</th>
            <th style="width: 60%;">제목</th>
            <th style="width: 30%;">등록일시</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="question : ${questionList}">
            <td th:text="${question.id}">1</td>
            <td th:text="${question.subject}">제목 예시</td>
            <td th:text="${question.createDate}">2026-04-23</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
