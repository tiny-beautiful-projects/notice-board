<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>질문 게시판</title>
    <!-- 외부 CSS 연결 -->
    <link rel="stylesheet" type="text/css" th:href="@{/index.css}">
</head>
<body>

<div class="board-container">
    <h1>질문 게시판</h1>

    <form id="questionForm" class="question-form">
        <div class="form-group">
            <label for="subject">제목</label>
            <input type="text" id="subject" name="subject" placeholder="제목을 입력하세요" required>
        </div>
        <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" name="content" rows="4" placeholder="내용을 입력하세요" required></textarea>
        </div>
        <button type="submit" class="btn-submit">질문 등록</button>
    </form>
    <!-- 질문 목록 테이블 -->
    <table>
        <thead>
        <tr>
            <th style="width: 10%;">번호</th>
            <th style="width: 60%;">제목</th>
            <th style="width: 30%;">등록일시</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="question : ${questionList}">
            <td th:text="${question.id}">1</td>
            <td th:text="${question.subject}">제목 예시</td>
            <td th:text="${question.createDate}">2026-04-23</td>
        </tr>
        </tbody>
    </table>
</div>
<!-- 비동기 처리를 위한 자바스크립트 -->
<script>
    document.getElementById("questionForm").addEventListener("submit", function(event){
        // 브라우저의 기본 submit 동작(페이지 이동/새로고침)을 막습니다.
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);

        // Fetch API를 이용해 페이지 이동 없이 서버로 POST 요청을 보냅니다.
        fetch("/question/create", {
            method:"POST",
            body: formData,
        }).then((response)=> {
            if(response.ok){
                return response.text();
            }
            throw new Error("서버 전송 실패")
        }).then((result)=> {
            // 저장이 완료되면 입력창을 비우고 페이지를 새로고침하여 최신 DB 데이터를 반영합니다.
            if(result === "success"){
                form.reset();
                location.reload();
            }
        }).catch((error)=> {
            console.error('Error:', error);
            alert('오류가 발생했습니다.');
        })

    })
</script>
</body>
</html>
